name: ProgrammingPlanet Godot iOS
on:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - 'scripts-ci/**'
      - '.github/workflows/planet-ios.yml'
  workflow_dispatch:
jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and iOS export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip
          unzip -q godot.zip -d godot-bin
          GODOT_APP="$(find godot-bin -name Godot.app -type d | head -1)"
          test -n "$GODOT_APP"
          echo "GODOT_BIN=$PWD/$GODOT_APP/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates-extracted
          cp -R templates-extracted/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable/"
      - name: Validate project and export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --editor --quit 2>&1 | tee build/import.log
          echo "=== Godot and export template diagnostics ===" | tee build/preflight.txt
          "$GODOT_BIN" --version | tee -a build/preflight.txt
          xcodebuild -version | tee -a build/preflight.txt
          find "$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable" -maxdepth 2 -type f | head -30 | tee -a build/preflight.txt
          echo "=== export preset (non-secret fields) ===" | tee -a build/preflight.txt
          grep -E "^(name|platform|application/app_store_team_id|application/bundle_identifier|application/export_project_only)=" export_presets.cfg | tee -a build/preflight.txt
          "$GODOT_BIN" --verbose --headless --path . --export-release iOS build/ProgrammingPlanet.zip 2>&1 | tee build/export.log
          find build -maxdepth 4 -type f | sort | tee build/files.txt
          test -n "$(find build -name '*.xcodeproj' -type d -print -quit)"
      - name: Compile unsigned iOS app with Xcode
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$(find build -name '*.xcodeproj' -type d | head -1)"
          xcodebuild -list -project "$PROJ" | tee build/xcode-list.log
          SCHEME="$(xcodebuild -list -json -project "$PROJ" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("project",{}).get("schemes") or [""])[0])')"
          test -n "$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/xcodebuild.log
      - name: Package unsigned IPA for external signing
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/ProgrammingPlanet.app' -type d -print -quit)"
          test -n "$APP"
          mkdir -p build/unsigned-payload/Payload
          ditto "$APP" build/unsigned-payload/Payload/ProgrammingPlanet.app
          (cd build/unsigned-payload && zip -qry ../ProgrammingPlanet-unsigned.ipa Payload)
          test -s build/ProgrammingPlanet-unsigned.ipa
          echo "Unsigned IPA generated; must be signed before installation."
      - name: Upload standalone unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProgrammingPlanet-V0.4.0-unsigned-IPA
          path: build/ProgrammingPlanet-unsigned.ipa
          if-no-files-found: error
      - name: Upload build evidence (not a signed IPA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProgrammingPlanet-iOS-build-evidence
          path: |
            build/*.log
            build/*.txt
            build/*.xcodeproj/**
            build/*.xcworkspace/**
          if-no-files-found: warn
